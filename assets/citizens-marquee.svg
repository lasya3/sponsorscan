<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 34" width="1200" height="34" role="img" aria-label="U.S. citizens and green card holders can use SponsorScan too. Sponsorship data from official DOL LCA filings; postings straight from Greenhouse, Lever, Ashby and Workday; no API keys; emails only new jobs.">
  <title>SponsorScan, also for U.S. citizens and green card holders</title>
  <style>
    text { font-family: Consolas, "SFMono-Regular", Menlo, "Liberation Mono", monospace;
           font-size: 13.5px; letter-spacing: 0.4px; fill: #8a8a90; }
    .hi { fill: #3dd39b; font-weight: 700; }
    .sep { fill: #3a3a40; }
  </style>
  <defs>
    <linearGradient id="fade-l" x1="0" x2="1">
      <stop offset="0" stop-color="#0d0d0f"/><stop offset="1" stop-color="#0d0d0f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-r" x1="1" x2="0">
      <stop offset="0" stop-color="#0d0d0f"/><stop offset="1" stop-color="#0d0d0f" stop-opacity="0"/>
    </linearGradient>
    <text id="msg" y="22" textLength="3240" lengthAdjust="spacing"><tspan class="hi">U.S. CITIZEN OR GREEN CARD HOLDER? IT WORKS FOR YOU TOO</tspan><tspan class="sep">   ◆   </tspan>sponsorship data from official DOL LCA filings<tspan class="sep">   ◆   </tspan>postings straight from Greenhouse, Lever, Ashby and Workday<tspan class="sep">   ◆   </tspan>drops postings that rule you out: clearance, PhD-required, senior titles, citizenship-only<tspan class="sep">   ◆   </tspan>no API keys, no aggregators<tspan class="sep">   ◆   </tspan>emails only jobs it has never shown you<tspan class="sep">   ◆   </tspan>runs on a schedule in GitHub Actions<tspan class="sep">   ◆   </tspan></text>
  </defs>

  <rect width="1200" height="34" fill="#0d0d0f"/>
  <line x1="0" y1="0.5" x2="1200" y2="0.5" stroke="#1e1e22"/>
  <!-- The message is drawn twice, side by side, and slides left by exactly one
       copy's width, so the loop has no seam. textLength pins that width
       whatever font the viewer has. SMIL rather than CSS animation, since it
       runs wherever the SVG is shown as an image. -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      from="0 0" to="-3240 0" dur="70s" repeatCount="indefinite"/>
    <use href="#msg" x="0"/>
    <use href="#msg" x="3240"/>
  </g>
  <rect width="80" height="34" fill="url(#fade-l)"/>
  <rect x="1120" width="80" height="34" fill="url(#fade-r)"/>
</svg>
