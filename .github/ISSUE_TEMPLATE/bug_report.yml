name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove any personal details (names, email
        addresses, visa status, credentials) from logs before pasting them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. python sponsorscan.py load-lca --latest --replace
        2. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `python sponsorscan.py doctor`
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Error output or logs
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Windows 11, Python 3.12, running locally or in GitHub Actions"
    validations:
      required: true
